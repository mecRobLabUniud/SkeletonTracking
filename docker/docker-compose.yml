services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Panda system 4.1.2 speaks libfranka server version 4 (0.8.0).
        # Use /opt/libfranka/lib/cmake/Franka for a robot >= 4.2.1 (0.9.2).
        LIBFRANKA_CMAKE_DIR: /opt/libfranka-0.8.0/lib/cmake/Franka
    image: mecroblabuniud/r3d-project:latest
    container_name: R3D_project
    stdin_open: true
    tty: true
    init: true
    # Franka FCI needs host networking: with the Docker bridge, libfranka's UDP
    # handshake to the robot (172.16.0.2) times out.
    network_mode: host
    # user: lab
    privileged: true
    # ── NVIDIA GPU acceleration ────────────────────────────────────────────
    # Requires nvidia-container-toolkit installed on the host:
    #   sudo apt-get install nvidia-container-toolkit
    #   sudo systemctl restart docker
    runtime: nvidia
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,display,video
      - __EGL_VENDOR_LIBRARY_FILENAMES=/usr/lib/x86_64-linux-gnu/libEGL_nvidia.so.0
      - LD_LIBRARY_PATH=/usr/local/lib:/opt/mujoco/lib:/opt/libfranka/lib:/usr/lib/x86_64-linux-gnu
    # increased shared memory for MediaPipe / shared-memory image buffers
    shm_size: 2gb
    devices:
      - /dev:/dev
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-modeset
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:rw
      # NVIDIA user-space libraries from the host (mount points match driver
      # version 580.105.08; adjust if your host driver differs).
      - /usr/lib/x86_64-linux-gnu/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libEGL_nvidia.so.0:/usr/lib/x86_64-linux-gnu/libEGL_nvidia.so.0:ro
      - /usr/lib/x86_64-linux-gnu/libGLX_nvidia.so.0:/usr/lib/x86_64-linux-gnu/libGLX_nvidia.so.0:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-opencl.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-opencl.so.1:ro
      - /etc/OpenCL/vendors:/etc/OpenCL/vendors:ro
    working_dir: /home/lab/SkeletonTracking
