services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: skeletontracking:dev
    container_name: R3D_project
    stdin_open: true
    tty: true
    init: true
    # network_mode: host
    # user: lab
    privileged: true
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
    ports:
      # Flask web interface (--gui)
      - "5000:5000"
    working_dir: /home/lab/SkeletonTracking
    # devices:
    #   - /dev:/dev
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
