<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Panda — Franka Emika DAE Viewer</title>
<script type="importmap">

    "imports": {

      <img id="image2" src="" style="max-width:100%;">

    <div>
      <img id="image3" src="" style="max-width:100%;">
    </div>
    <div>
      <img id="image4" src="" style="max-width:100%;">
    </div>
  </div>
</div>


<script type="module" src="js/scene.js"></script>
<script type="module" src="js/robot.js"></script>
